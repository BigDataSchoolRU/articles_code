# apache/kafka 4.3.0, KRaft без ZooKeeper, прогнано на стенде 2026-09-05
# Один брокер, он же контроллер. Для демо speed layer этого достаточно.
services:
  kafka:
    image: apache/kafka:4.3.0
    container_name: lambda_architecture_kafka
    ports:
      - "9092:9092"
    environment:
      # KRaft: один узел совмещает роли брокера и контроллера
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # реплика одна, потому что брокер один
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 168
      # автосоздание выключено: топик создаёт сам event_producer.py при первом запуске
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
