# Apache Spark 4.0.4, openlineage-spark_2.13 1.55.0, прогнано на стенде 2026-11-12: Spark пишет в консоль только ошибки, OpenLineage только строки об отправке событий
rootLogger.level = error
rootLogger.appenderRef.stdout.ref = console
appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n
logger.olemit.name = io.openlineage.spark.agent.EventEmitter
logger.olemit.level = info
