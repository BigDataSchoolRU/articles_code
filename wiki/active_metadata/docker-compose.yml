# postgres 18.6 в Docker, прогнано на стенде 2026-11-13: источник событий метаданных на event trigger и pg_notify
services:
  pg:
    image: postgres:18.6
    container_name: active-metadata-pg
    mem_limit: 1g
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demo
    ports:
      - "127.0.0.1:55441:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # схемы демо, служебная схема meta и event trigger создаются при первом старте на чистом томе
      - ./setup.sql:/docker-entrypoint-initdb.d/01_setup.sql:ro
    healthcheck:
      # -h 127.0.0.1: на время initdb временный сервер слушает только сокет, по TCP готов уже рабочий
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U demo -d demo"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
