# postgres 18.6 в Docker, прогнано на стенде 2026-11-06: один сервер под хранилище событий
services:
  pg:
    image: postgres:18.6
    container_name: event-sourcing-pg
    mem_limit: 1g
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: es
    ports:
      - "127.0.0.1:55437:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # схема журнала создаётся при первом старте на чистом томе
      - ./schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      # -h 127.0.0.1: на время initdb временный сервер слушает только сокет, по TCP готов уже рабочий
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U demo -d es"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
