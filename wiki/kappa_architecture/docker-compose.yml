# apache/kafka 4.3.2, KRaft без ZooKeeper, прогнано на стенде 2026-11-14
# Один брокер, он же контроллер. Для демо неизменяемого лога Kappa этого достаточно.
services:
  kafka:
    image: apache/kafka:4.3.2
    container_name: kappa-architecture-kafka
    mem_limit: 1g
    environment:
      # KRaft: один узел совмещает роли брокера и контроллера
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT для утилит внутри контейнера, EXTERNAL для Python-скриптов на хосте
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:59093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://127.0.0.1:59093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # реплика одна, потому что брокер один
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # топики создают сами скрипты, со своим retention
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # проверка retention раз в 5 с вместо 5 минут по умолчанию, чтобы retention_limit.py не ждал
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 5000
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "127.0.0.1:59093:59093"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
