# postgres 18.6 в Docker, прогнано на стенде 2026-11-05: хранилище с витриной для статьи про Reverse ETL
services:
  dwh:
    image: postgres:18.6
    container_name: reverse-etl-dwh
    mem_limit: 1g
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: dwh
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      # init.sql выполняется один раз, при первом старте с пустым томом
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # -h 127.0.0.1: на время initdb временный сервер слушает только сокет, по TCP готов уже рабочий
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U demo -d dwh"]
      interval: 2s
      timeout: 3s
      retries: 30
