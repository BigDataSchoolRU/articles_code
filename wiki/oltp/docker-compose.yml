# postgres 18.6 в Docker, стенд для статьи про OLTP, прогнано на стенде 2026-11-03
services:
  postgres:
    image: postgres:18.6
    container_name: oltp-postgres
    mem_limit: 2g
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: oltp
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d oltp"]
      interval: 2s
      timeout: 3s
      retries: 30
