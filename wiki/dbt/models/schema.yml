# dbt-core 1.12.3, синтаксис тестов по документации dbt Core, прогнано на стенде 2026-08-28
version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['completed', 'pending', 'cancelled', 'refunded']

  - name: fct_daily_orders
    columns:
      - name: order_date
        data_tests:
          - not_null
      - name: region
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: region
