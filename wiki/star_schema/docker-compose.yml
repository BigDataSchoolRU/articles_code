# postgres 18.6 в Docker, прогнано на стенде 2026-11-07: один сервер, две схемы (star и snowflake) на одних данных
services:
  pg:
    image: postgres:18.6
    container_name: star-schema-pg
    mem_limit: 1g
    # shared_buffers 256MB: обе таблицы фактов помещаются в кэш, замеры времени не скачут от чтения с диска
    # max_wal_size 256MB: загрузка 4 млн строк не раздувает WAL на диске до гигабайта
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_wal_size=256MB"]
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: dwh
    ports:
      - "127.0.0.1:55439:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # SQL-сценарии видны внутри контейнера в /demo/sql
      - ./sql:/demo/sql:ro
    healthcheck:
      # -h 127.0.0.1: на время initdb временный сервер слушает только сокет, по TCP готов уже рабочий
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U demo -d dwh"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
