# postgres 18.6 в Docker, стенд для статьи про идемпотентность
services:
  postgres:
    image: postgres:18.6
    container_name: idempotency-postgres
    mem_limit: 1g
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: idem
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d idem"]
      interval: 2s
      timeout: 3s
      retries: 30
