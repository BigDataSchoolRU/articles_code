# docker compose v5.1.3, образы apache/kafka:4.3.0, прогон 2026-08-14
services:
  kafka:
    image: apache/kafka:4.3.0
    container_name: kc_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  connect:
    image: apache/kafka:4.3.0
    container_name: kc_connect
    depends_on:
      - kafka
    ports:
      - "8083:8083"
    volumes:
      - ./connect-distributed.properties:/opt/kafka/config/kc.properties:ro
      - ./data:/data
    command: ["/opt/kafka/bin/connect-distributed.sh", "/opt/kafka/config/kc.properties"]
