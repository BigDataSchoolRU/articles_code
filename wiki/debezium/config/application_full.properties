# конфигурация Debezium Server 3.6.1.Final, прогнана на стенде
debezium.sink.type=http
debezium.sink.http.url=http://host.docker.internal:8100/events

debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.offset.storage.file.filename=/debezium/data/offsets_full.dat
debezium.source.offset.flush.interval.ms=1000

debezium.source.database.hostname=postgres
debezium.source.database.port=5432
debezium.source.database.user=postgres
debezium.source.database.password=postgres
debezium.source.database.dbname=shopdb

debezium.source.topic.prefix=shop
debezium.source.table.include.list=public.orders
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=debezium_shop_full
debezium.source.publication.name=dbz_publication_full
debezium.source.snapshot.mode=no_data

debezium.format.key=json
debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.key.schemas.enable=false
quarkus.log.console.json=false

# numeric больше не уезжает в base64, значение приходит строкой
debezium.source.decimal.handling.mode=string

# плоский формат вместо конверта before/after
debezium.transforms=unwrap
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
debezium.transforms.unwrap.add.fields=op,table,lsn
debezium.transforms.unwrap.delete.tombstone.handling.mode=rewrite
