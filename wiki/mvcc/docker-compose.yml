# postgres 18.6 в Docker, прогнано на стенде 2026-11-06: один сервер для демо MVCC
services:
  pg:
    image: postgres:18.6
    container_name: mvcc-pg
    mem_limit: 1g
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: mvcc
    ports:
      - "127.0.0.1:55436:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # SQL-сценарии видны внутри контейнера в /demo/sql
      - ./sql:/demo/sql:ro
    healthcheck:
      # -h 127.0.0.1: на время initdb временный сервер слушает только сокет, по TCP готов уже рабочий
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U demo -d mvcc"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
