# Apache Kafka 4.3.2, три узла KRaft (broker + controller), прогнано на стенде 2026-10-22
name: blog-kafka_consumer_rebalance_protocol

x-kafka-env: &kafka-env
  CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093,2@kafka2:9093,3@kafka3:9093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_HEAP_OPTS: -Xms768m -Xmx768m
  # Тайм-аут сессии для group.protocol=consumer задаёт брокер, не клиент.
  # По умолчанию 45 с и минимум тоже 45 с; опускаем до 10 с, как у classic-клиентов в демо.
  KAFKA_GROUP_CONSUMER_MIN_SESSION_TIMEOUT_MS: 6000
  KAFKA_GROUP_CONSUMER_SESSION_TIMEOUT_MS: 10000
  # Нижняя граница heartbeat тоже 5 с по умолчанию; опускаем, чтобы группа могла выставить 1 с
  KAFKA_GROUP_CONSUMER_MIN_HEARTBEAT_INTERVAL_MS: 1000
  # Сам интервал heartbeat по умолчанию остаётся 5000 мс, assignors тоже (uniform,range)

x-kafka: &kafka
  image: apache/kafka:4.3.2
  mem_limit: 1536m
  healthcheck:
    test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 > /dev/null 2>&1"]
    interval: 5s
    timeout: 10s
    retries: 30
    start_period: 10s

services:
  kafka1:
    <<: *kafka
    hostname: kafka1
    ports: ["127.0.0.1:9092:9092"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:19092,HOST://localhost:9092

  kafka2:
    <<: *kafka
    hostname: kafka2
    ports: ["127.0.0.1:9094:9094"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:19092,HOST://localhost:9094

  kafka3:
    <<: *kafka
    hostname: kafka3
    ports: ["127.0.0.1:9096:9096"]
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: INTERNAL://:19092,CONTROLLER://:9093,HOST://:9096
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:19092,HOST://localhost:9096
