# SeaweedFS 4.48 + iceberg-rest-fixture 1.10.1 + Trino 484 + Spark 4.0.4 (Iceberg 1.10.1), прогнано на стенде 2026-10-22
name: blog-iceberg_table_statistics

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: admin
  AWS_SECRET_ACCESS_KEY: password123
  AWS_REGION: us-east-1

services:
  # S3-совместимое хранилище: здесь лежат data-файлы, манифесты и Puffin
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    mem_limit: 1g
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
      - s3_data:/data

  # одноразовый шаг: создаёт бакет warehouse и завершается
  create_bucket:
    image: chrislusf/seaweedfs:4.48
    mem_limit: 256m
    depends_on: [seaweedfs]
    entrypoint: ["sh", "-c", "until echo 's3.bucket.create -name warehouse' | weed shell -master=seaweedfs:9333 2>&1 | grep -qiE 'created|exist'; do sleep 2; done; echo bucket warehouse ready"]

  # REST-каталог Iceberg: хранит указатель на текущий metadata.json каждой таблицы
  rest:
    image: apache/iceberg-rest-fixture:1.10.1
    mem_limit: 1g
    depends_on:
      create_bucket: { condition: service_completed_successfully }
    environment:
      <<: *s3-env
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://seaweedfs:8333
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "127.0.0.1:8181:8181"

  trino:
    image: trinodb/trino:484
    mem_limit: 4g
    depends_on:
      rest: { condition: service_healthy }
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # каталог iceberg добавляется к встроенным tpch, tpcds и memory
      - ./trino/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
      - ./:/demo:ro

  spark:
    build: { context: ., dockerfile: spark.Dockerfile }
    image: blog-iceberg_table_statistics-spark:4.0.4-iceberg1.10.1
    mem_limit: 3g
    depends_on:
      rest: { condition: service_healthy }
    environment:
      <<: *s3-env
    command: ["sleep", "infinity"]
    volumes:
      - ./:/demo:ro

volumes:
  s3_data:
