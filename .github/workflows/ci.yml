name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: selfcheck (структура, py_compile)
        run: ops/selfcheck.sh
      - name: shellcheck
        run: shellcheck -S error $(git ls-files '*.sh' '.githooks/*')
      # gitleaks-action для репо организации требует платную лицензию — ставим бинарник.
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner
